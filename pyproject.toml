[project]
name = "funapi-sciencedb"
version = "1.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "funutil>=1.0.42", "httpx>=0.20.0", "attrs>=22.2.0", "python-dateutil>=2.8.2",]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `src/sciencedb` 是废弃导入路径的兼容层（只有一个 __init__.py，转发到
# funapi_sciencedb），保留到下一次破坏性版本再删除。
packages = ["src/funapi_sciencedb", "src/sciencedb"]

[dependency-groups]
dev = [ "pytest>=7.0",]
