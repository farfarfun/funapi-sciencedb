[project]
name = "funapi-sciencedb"
version = "1.1.2"
description = "科学数据银行（ScienceDB）Open API 的 Python 客户端，由 openapi-python-client 根据官方 OpenAPI 文档自动生成"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [ "httpx>=0.20.0", "attrs>=22.2.0", "python-dateutil>=2.8.2",]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `src/sciencedb` 是废弃导入路径的兼容层（只有一个 __init__.py，转发到
# funapi_sciencedb），保留到下一次破坏性版本再删除。
packages = ["src/funapi_sciencedb", "src/sciencedb"]

[dependency-groups]
dev = [ "pytest>=9.0.3",]
# generate.py 用来重新拉取 ScienceDB OpenAPI 文档并重新生成客户端代码，
# 这几个依赖只有跑生成脚本时才需要，不进最终发布包。
generate = [ "requests>=2.31.0", "funapi>=1.0.2", "openapi-python-client>=0.21.0",]

[tool.ruff]
target-version = "py310"
lint.ignore = ["PYI034"]
